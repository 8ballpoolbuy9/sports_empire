<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <title>The Sports Empire | Telegram Channel</title>
  <style>
    :root {
      --red: #B51F2A;
      --red-dark: #74131C;
      --gold: #D8B879;
      --bg: #080808;
      --panel: #151313;
      --text: #F7F1E8;
      --muted: #C8BFB4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% 48%, rgba(181, 31, 42, .20), transparent 45%),
        linear-gradient(rgba(216, 184, 121, .075) 1px, transparent 1px),
        linear-gradient(90deg, rgba(216, 184, 121, .075) 1px, transparent 1px),
        var(--bg);
      background-size: auto, 68px 68px, 68px 68px, auto;
    }
    .card {
      width: min(100%, 414px);
      padding: 48px 34px 42px;
      text-align: center;
      border: 1px solid rgba(216, 184, 121, .30);
      border-radius: 30px;
      background: linear-gradient(155deg, #211719 0%, #121010 58%, #1B1415 100%);
      box-shadow: 0 24px 85px rgba(181, 31, 42, .16), 0 18px 55px rgba(0,0,0,.58);
    }
    .avatar {
      width: 124px;
      height: 124px;
      display: block;
      margin: 0 auto 30px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold);
      box-shadow: 0 0 24px rgba(181, 31, 42, .28), 0 0 0 5px rgba(216, 184, 121, .08);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding: 8px 17px;
      border: 1px solid rgba(216, 184, 121, .38);
      border-radius: 99px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .28em;
    }
    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 10px var(--red);
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 7.5vw, 42px);
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: .055em;
    }
    h1 span { display: block; color: var(--red); }
    .description {
      max-width: 310px;
      margin: 22px auto 34px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }
    .join {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 11px;
      width: 100%;
      min-height: 57px;
      padding: 15px 20px;
      border-radius: 19px;
      background: var(--red);
      color: #fffaf3;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .09em;
      box-shadow: 0 12px 30px rgba(181, 31, 42, .28);
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .join:hover {
      transform: translateY(-3px);
      background: #D02B36;
      box-shadow: 0 16px 35px rgba(181, 31, 42, .38);
    }
    .join:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .join svg { width: 19px; height: 19px; flex: 0 0 auto; }
    .footer {
      margin: 20px 0 0;
      color: var(--gold);
      font-size: 10px;
      letter-spacing: .25em;
    }
    @media (max-width: 480px) {
      body { padding: 18px 14px; }
      .card { padding: 38px 24px 34px; border-radius: 25px; }
      .avatar { width: 112px; height: 112px; margin-bottom: 26px; }
      .description { font-size: 14px; margin: 19px auto 29px; }
      .join { min-height: 54px; font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>

</head>
<body>
  <main class="card">
    <img class="avatar" src="assets/avatar.jpg" alt="The Sports Empire logo">
    <div class="status">99K+ MEMBERS</div>
    <h1>THE SPORTS <span>EMPIRE</span></h1>
    <p class="description">
      Your destination for football, cricket, match updates, and sports analysis.
    </p>
    <!-- Replace the URL below with your actual Telegram channel invite/link. -->
    <a class="join" id="telegramLink" href="https://t.me/+suFNCATB2Uk3YTZl"
       target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="m21 3-7.2 18-3.7-7.1L3 10.2 21 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="m10.1 13.9 4.2-4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      JOIN TELEGRAM CHANNEL
    </a>
    <p class="footer">FOOTBALL · CRICKET · ANALYSIS</p>
  </main>
  <script>
    // Optional: set your Telegram channel link here.
    const TELEGRAM_URL = "https://t.me/+suFNCATB2Uk3YTZl";
    document.getElementById("telegramLink").href = TELEGRAM_URL;

    // // Automatically redirect visitors to the Telegram channel after 1 second.
    // window.setTimeout(() => {

</body>
</html>
